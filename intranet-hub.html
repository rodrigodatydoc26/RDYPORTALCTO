<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Intranet — Central de Acessos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg-0: #08080c;
    --bg-1: #0e0e14;
    --bg-2: #16161f;
    --surface: rgba(255, 255, 255, 0.03);
    --surface-hover: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text: #f2f2f5;
    --text-dim: #a0a0ac;
    --text-faint: #606068;
    --gold: #d4af37;
    --gold-soft: #e8c668;
    --accent: #7c3aed;
    --accent-soft: #a78bfa;
    --danger: #ef4444;
    --success: #10b981;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
    --shadow-glow: 0 0 40px -10px var(--gold);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg-0);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: -50%;
    background:
      radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(124, 58, 237, 0.06) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 60%);
    z-index: -2;
    animation: drift 30s ease-in-out infinite;
  }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(-3%, 2%) rotate(1deg); }
    66% { transform: translate(2%, -2%) rotate(-1deg); }
  }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.5;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
  }

  /* ===== HEADER ===== */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(8, 8, 12, 0.7);
    border-bottom: 1px solid var(--border);
    padding: 18px 40px;
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--gold) 0%, #b8941f 100%);
    display: grid;
    place-items: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: #0a0a0a;
    box-shadow: 0 4px 20px -4px rgba(212, 175, 55, 0.5);
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .brand-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.01em;
  }

  .brand-sub {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: 'JetBrains Mono', monospace;
  }

  .greeting {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding-left: 32px;
    border-left: 1px solid var(--border);
    margin-left: 8px;
  }

  .greeting-text {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 15px;
  }

  .greeting-clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .search-wrap {
    position: relative;
    width: 340px;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--text-faint);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    height: 40px;
    padding: 0 70px 0 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    transition: all 0.2s ease;
  }

  .search-input:focus {
    outline: none;
    border-color: var(--border-strong);
    background: var(--surface-hover);
  }

  .search-input::placeholder { color: var(--text-faint); }

  .kbd {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    gap: 4px;
    pointer-events: none;
  }

  .kbd span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 6px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
  }

  .admin-btn {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-sm);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.2s ease;
  }

  .admin-btn:hover {
    background: var(--surface-hover);
    color: var(--gold);
    border-color: var(--gold);
  }

  .admin-btn svg { width: 18px; height: 18px; }

  /* ===== MAIN ===== */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 48px 40px 80px;
    position: relative;
    z-index: 2;
  }

  .hero {
    margin-bottom: 56px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 40px;
  }

  .hero h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(32px, 5vw, 56px);
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .hero h1 em {
    font-style: normal;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-soft) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    text-align: right;
    padding-bottom: 8px;
  }

  .hero-meta strong {
    color: var(--gold);
    font-weight: 500;
  }

  /* Category section */
  .category-section {
    margin-bottom: 48px;
    animation: fadeUp 0.6s ease backwards;
  }

  .category-section:nth-child(1) { animation-delay: 0.05s; }
  .category-section:nth-child(2) { animation-delay: 0.15s; }
  .category-section:nth-child(3) { animation-delay: 0.25s; }
  .category-section:nth-child(4) { animation-delay: 0.35s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .category-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .category-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    box-shadow: 0 0 12px currentColor;
  }

  .category-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .category-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--border), transparent);
  }

  .category-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
  }

  /* Cards grid */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }

  @media (max-width: 1100px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 820px)  { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px)  { .cards-grid { grid-template-columns: 1fr; } }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    min-height: 180px;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.04), transparent 40%);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--card-color, var(--gold));
    box-shadow: 0 20px 60px -20px var(--card-color, var(--gold));
  }

  .card:hover::before { opacity: 1; }

  .card-image {
    width: 54px;
    height: 54px;
    border-radius: 12px;
    background: var(--card-color-soft, rgba(212, 175, 55, 0.1));
    border: 1px solid var(--card-color, var(--border));
    display: grid;
    place-items: center;
    overflow: hidden;
    margin-bottom: 16px;
    flex-shrink: 0;
  }

  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-image .placeholder {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: var(--card-color, var(--gold));
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 17px;
    line-height: 1.2;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }

  .card-desc {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
    flex: 1;
  }

  .card-arrow {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--bg-2);
    display: grid;
    place-items: center;
    opacity: 0;
    transform: translate(-6px, 6px);
    transition: all 0.3s ease;
  }

  .card:hover .card-arrow {
    opacity: 1;
    transform: translate(0, 0);
  }

  .card-arrow svg { width: 14px; height: 14px; color: var(--card-color, var(--gold)); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-faint);
  }

  .empty svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5; }

  .empty h3 {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.2s ease;
  }

  .modal-overlay.active { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--bg-1);
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    width: 100%;
    max-width: 640px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
    animation: slideUp 0.3s ease;
  }

  .modal.wide { max-width: 900px; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-header {
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 20px;
  }

  .modal-close {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.2s ease;
  }

  .modal-close:hover {
    background: var(--surface);
    color: var(--text);
  }

  .modal-close svg { width: 16px; height: 16px; }

  .modal-body { padding: 24px 28px; }

  /* Form */
  .form-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }

  .form-row-double {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: 'JetBrains Mono', monospace;
  }

  input[type="text"], input[type="url"], input[type="password"], select, textarea {
    width: 100%;
    padding: 11px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--gold);
    background: var(--bg-1);
  }

  textarea { resize: vertical; min-height: 70px; }

  .color-picker {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .color-swatch {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s ease;
    position: relative;
  }

  .color-swatch.active {
    border-color: white;
    transform: scale(1.1);
  }

  .color-swatch.active::after {
    content: '✓';
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: white;
    font-weight: 700;
    font-size: 14px;
  }

  .image-upload {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .image-preview {
    width: 60px;
    height: 60px;
    border-radius: 10px;
    background: var(--bg-2);
    border: 1px dashed var(--border-strong);
    display: grid;
    place-items: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .image-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .image-preview svg {
    width: 20px;
    height: 20px;
    color: var(--text-faint);
  }

  /* Buttons */
  .btn {
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn:hover { background: var(--surface-hover); }

  .btn svg { width: 15px; height: 15px; }

  .btn-primary {
    background: linear-gradient(135deg, var(--gold) 0%, #b8941f 100%);
    border-color: var(--gold);
    color: #0a0a0a;
    font-weight: 600;
  }

  .btn-primary:hover {
    box-shadow: 0 8px 24px -8px var(--gold);
    transform: translateY(-1px);
  }

  .btn-danger {
    color: var(--danger);
    border-color: rgba(239, 68, 68, 0.3);
  }

  .btn-danger:hover {
    background: rgba(239, 68, 68, 0.1);
    border-color: var(--danger);
  }

  .modal-footer {
    padding: 18px 28px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  /* Admin tabs */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--bg-2);
    border-radius: var(--radius-sm);
    margin-bottom: 20px;
  }

  .tab {
    flex: 1;
    padding: 10px 16px;
    background: transparent;
    border: none;
    border-radius: 8px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .tab.active {
    background: var(--surface);
    color: var(--text);
  }

  /* Admin lists */
  .item-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 16px;
  }

  .item-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    transition: all 0.2s ease;
  }

  .item-row:hover { border-color: var(--border-strong); }

  .item-row-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    overflow: hidden;
  }

  .item-row-icon img { width: 100%; height: 100%; object-fit: cover; }

  .item-row-info {
    flex: 1;
    min-width: 0;
  }

  .item-row-title {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-row-sub {
    font-size: 11px;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-row-actions {
    display: flex;
    gap: 6px;
  }

  .icon-btn {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.2s ease;
  }

  .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
  .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg-1);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow);
    z-index: 200;
    font-size: 13px;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s ease;
  }

  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }
  .toast svg { width: 16px; height: 16px; }

  /* Login screen */
  .login-box {
    padding: 40px 32px;
    text-align: center;
  }

  .login-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--gold) 0%, #b8941f 100%);
    margin: 0 auto 20px;
    display: grid;
    place-items: center;
    color: #0a0a0a;
  }

  .login-icon svg { width: 26px; height: 26px; }

  .login-box h2 {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    margin-bottom: 6px;
  }

  .login-box p {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 24px;
  }

  .login-hint {
    margin-top: 12px;
    font-size: 11px;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
  }

  @media (max-width: 720px) {
    header { padding: 14px 18px; gap: 12px; flex-wrap: wrap; }
    .greeting { display: none; }
    .search-wrap { width: 100%; order: 3; }
    main { padding: 28px 18px 60px; }
    .hero { flex-direction: column; align-items: flex-start; }
    .hero-meta { text-align: left; }
    .form-row-double { grid-template-columns: 1fr; }
    .modal-header, .modal-body, .modal-footer { padding-left: 18px; padding-right: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">H</div>
    <div class="brand-text">
      <div class="brand-name">Hub Corporativo</div>
      <div class="brand-sub">Intranet · v1.0</div>
    </div>
  </div>

  <div class="greeting">
    <div class="greeting-text" id="greetingText">Bom dia</div>
    <div class="greeting-clock" id="clock">--:--:--</div>
  </div>

  <div class="search-wrap">
    <i data-lucide="search"></i>
    <input type="text" class="search-input" id="searchInput" placeholder="Buscar acesso..." />
    <div class="kbd"><span>⌘</span><span>K</span></div>
  </div>

  <button class="admin-btn" id="adminBtn" title="Painel Admin">
    <i data-lucide="settings"></i>
  </button>
</header>

<main>
  <div class="hero">
    <h1>Central de <em>Acessos</em></h1>
    <div class="hero-meta">
      <div><strong id="totalLinks">0</strong> acessos · <strong id="totalCats">0</strong> categorias</div>
    </div>
  </div>

  <div id="content"></div>
</main>

<!-- MODAL: Admin Login -->
<div class="modal-overlay" id="loginModal">
  <div class="modal" style="max-width: 420px;">
    <div class="login-box">
      <div class="login-icon"><i data-lucide="lock"></i></div>
      <h2>Painel Administrativo</h2>
      <p>Digite a senha para gerenciar os acessos</p>
      <input type="password" id="loginPassword" placeholder="Senha de admin" autocomplete="off" />
      <div style="margin-top: 16px; display: flex; gap: 10px; justify-content: center;">
        <button class="btn" data-close="loginModal">Cancelar</button>
        <button class="btn btn-primary" data-action="do-login">Entrar</button>
      </div>
      <div class="login-hint">senha padrão: admin123</div>
    </div>
  </div>
</div>

<!-- MODAL: Admin Panel -->
<div class="modal-overlay" id="adminModal">
  <div class="modal wide">
    <div class="modal-header">
      <div class="modal-title">Painel Administrativo</div>
      <button class="modal-close" data-close="adminModal"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      <div class="tabs">
        <button class="tab active" data-tab="links">Links</button>
        <button class="tab" data-tab="categories">Categorias</button>
      </div>

      <!-- Links tab -->
      <div id="tab-links" class="tab-content">
        <button class="btn btn-primary" data-action="new-link">
          <i data-lucide="plus"></i> Novo acesso
        </button>
        <div class="item-list" id="linksList"></div>
      </div>

      <!-- Categories tab -->
      <div id="tab-categories" class="tab-content" style="display:none;">
        <button class="btn btn-primary" data-action="new-category">
          <i data-lucide="plus"></i> Nova categoria
        </button>
        <div class="item-list" id="categoriesList"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: Link editor -->
<div class="modal-overlay" id="linkEditorModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="linkEditorTitle">Novo acesso</div>
      <button class="modal-close" data-close="linkEditorModal"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label>Título</label>
        <input type="text" id="linkTitle" placeholder="Ex: Sistema ERP"/>
      </div>
      <div class="form-row">
        <label>URL</label>
        <input type="url" id="linkUrl" placeholder="https://..."/>
      </div>
      <div class="form-row">
        <label>Descrição (opcional)</label>
        <textarea id="linkDesc" placeholder="Breve descrição do acesso"></textarea>
      </div>
      <div class="form-row-double">
        <div class="form-row">
          <label>Categoria</label>
          <select id="linkCategory"></select>
        </div>
        <div class="form-row">
          <label>Imagem/Logo</label>
          <div class="image-upload">
            <div class="image-preview" id="imagePreview">
              <i data-lucide="image"></i>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px; flex:1;">
              <button type="button" class="btn" data-action="pick-image">
                <i data-lucide="upload"></i> Escolher
              </button>
              <button type="button" class="btn" data-action="clear-image" style="font-size:11px;">Remover</button>
            </div>
            <input type="file" id="linkImage" accept="image/*" style="display:none"/>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" data-close="linkEditorModal">Cancelar</button>
      <button class="btn btn-primary" data-action="save-link">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: Category editor -->
<div class="modal-overlay" id="categoryEditorModal">
  <div class="modal" style="max-width: 480px;">
    <div class="modal-header">
      <div class="modal-title" id="categoryEditorTitle">Nova categoria</div>
      <button class="modal-close" data-close="categoryEditorModal"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label>Nome</label>
        <input type="text" id="categoryName" placeholder="Ex: Financeiro"/>
      </div>
      <div class="form-row">
        <label>Cor</label>
        <div class="color-picker" id="colorPicker"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" data-close="categoryEditorModal">Cancelar</button>
      <button class="btn btn-primary" data-action="save-category">Salvar</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <i data-lucide="check-circle"></i>
  <span id="toastMessage">Salvo com sucesso</span>
</div>

<script>
  // ===== CONFIG =====
  const ADMIN_PASSWORD = 'admin123';
  const STORAGE_KEY = 'intranet_data_v1';

  const COLORS = [
    '#d4af37', '#7c3aed', '#10b981', '#ef4444',
    '#3b82f6', '#f97316', '#ec4899', '#14b8a6',
    '#8b5cf6', '#eab308', '#06b6d4', '#f43f5e'
  ];

  // ===== DEFAULT DATA =====
  const DEFAULT_DATA = {
    categories: [
      { id: 'c1', name: 'Operacional', color: '#d4af37' },
      { id: 'c2', name: 'Financeiro', color: '#10b981' },
      { id: 'c3', name: 'RH & Gestão', color: '#7c3aed' },
      { id: 'c4', name: 'Comunicação', color: '#3b82f6' }
    ],
    links: [
      { id: 'l1', title: 'ERP Corporativo', url: 'https://erp.empresa.com', desc: 'Sistema principal de gestão', categoryId: 'c1', image: null },
      { id: 'l2', title: 'Portal do Cliente', url: 'https://cliente.empresa.com', desc: 'Acesso aos contratos ativos', categoryId: 'c1', image: null },
      { id: 'l3', title: 'Dashboard Operações', url: 'https://ops.empresa.com', desc: 'Métricas em tempo real', categoryId: 'c1', image: null },
      { id: 'l4', title: 'Banco Online', url: 'https://banco.com.br', desc: 'Internet banking corporativo', categoryId: 'c2', image: null },
      { id: 'l5', title: 'Notas Fiscais', url: 'https://nfe.empresa.com', desc: 'Emissão e consulta de NF-e', categoryId: 'c2', image: null },
      { id: 'l6', title: 'Folha de Pagamento', url: 'https://folha.empresa.com', desc: 'Sistema de RH', categoryId: 'c3', image: null },
      { id: 'l7', title: 'Ponto Eletrônico', url: 'https://ponto.empresa.com', desc: 'Registro de frequência', categoryId: 'c3', image: null },
      { id: 'l8', title: 'E-mail Corporativo', url: 'https://mail.empresa.com', desc: 'Webmail institucional', categoryId: 'c4', image: null },
      { id: 'l9', title: 'Google Drive', url: 'https://drive.google.com', desc: 'Armazenamento em nuvem', categoryId: 'c4', image: null },
      { id: 'l10', title: 'Teams', url: 'https://teams.microsoft.com', desc: 'Comunicação interna', categoryId: 'c4', image: null }
    ]
  };

  // ===== STATE =====
  let data = loadData();
  let editingLinkId = null;
  let editingCategoryId = null;
  let selectedColor = COLORS[0];
  let selectedImage = null;
  let isAdmin = false;

  // ===== STORAGE =====
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return structuredClone(DEFAULT_DATA);
      return JSON.parse(raw);
    } catch { return structuredClone(DEFAULT_DATA); }
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // ===== RENDER =====
  function render() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const content = document.getElementById('content');
    content.innerHTML = '';

    let totalMatching = 0;

    data.categories.forEach(cat => {
      const links = data.links.filter(l =>
        l.categoryId === cat.id &&
        (l.title.toLowerCase().includes(search) || (l.desc || '').toLowerCase().includes(search))
      );
      if (links.length === 0) return;
      totalMatching += links.length;

      const section = document.createElement('section');
      section.className = 'category-section';
      section.innerHTML = `
        <div class="category-header">
          <div class="category-dot" style="background:${cat.color}; color:${cat.color}"></div>
          <div class="category-title">${escapeHtml(cat.name)}</div>
          <div class="category-line"></div>
          <div class="category-count">${links.length.toString().padStart(2, '0')}</div>
        </div>
        <div class="cards-grid">
          ${links.map(l => cardHtml(l, cat)).join('')}
        </div>
      `;
      content.appendChild(section);
    });

    if (totalMatching === 0) {
      content.innerHTML = `
        <div class="empty">
          <i data-lucide="${search ? 'search-x' : 'inbox'}"></i>
          <h3>${search ? 'Nenhum resultado' : 'Nenhum acesso cadastrado'}</h3>
          <p>${search ? 'Tente outra busca.' : 'Acesse o painel admin para adicionar.'}</p>
        </div>
      `;
    }

    document.getElementById('totalLinks').textContent = data.links.length;
    document.getElementById('totalCats').textContent = data.categories.length;

    // cursor glow
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
        card.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
      });
    });

    lucide.createIcons();
  }

  function cardHtml(link, cat) {
    const soft = hexToRgba(cat.color, 0.12);
    const initial = link.title.charAt(0).toUpperCase();
    const img = link.image
      ? `<img src="${link.image}" alt=""/>`
      : `<span class="placeholder">${initial}</span>`;
    return `
      <a class="card" href="${escapeAttr(link.url)}" target="_blank" rel="noopener"
         style="--card-color:${cat.color}; --card-color-soft:${soft}">
        <div class="card-image">${img}</div>
        <div class="card-title">${escapeHtml(link.title)}</div>
        ${link.desc ? `<div class="card-desc">${escapeHtml(link.desc)}</div>` : ''}
        <div class="card-arrow"><i data-lucide="arrow-up-right"></i></div>
      </a>
    `;
  }

  // ===== ADMIN =====
  document.getElementById('adminBtn').addEventListener('click', () => {
    if (isAdmin) {
      openAdmin();
    } else {
      openModal('loginModal');
      setTimeout(() => document.getElementById('loginPassword').focus(), 100);
    }
  });

  document.getElementById('loginPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryLogin();
  });

  function tryLogin() {
    const pwd = document.getElementById('loginPassword').value;
    if (pwd === ADMIN_PASSWORD) {
      isAdmin = true;
      document.getElementById('loginPassword').value = '';
      closeModal('loginModal');
      openAdmin();
      toast('Acesso autorizado', 'success');
    } else {
      toast('Senha incorreta', 'error');
    }
  }

  function openAdmin() {
    closeModal('loginModal');
    openModal('adminModal');
    renderAdminLinks();
    renderAdminCategories();
  }

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
      document.getElementById('tab-' + tab.dataset.tab).style.display = 'block';
    });
  });

  function renderAdminLinks() {
    const list = document.getElementById('linksList');
    if (data.links.length === 0) {
      list.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-faint); font-size:13px;">Nenhum link cadastrado</div>';
      return;
    }
    list.innerHTML = data.links.map(l => {
      const cat = data.categories.find(c => c.id === l.categoryId);
      const catColor = cat ? cat.color : '#666';
      const iconContent = l.image
        ? `<img src="${l.image}" alt=""/>`
        : `<span style="font-family:Syne; font-weight:800; color:${catColor}">${l.title.charAt(0).toUpperCase()}</span>`;
      return `
        <div class="item-row">
          <div class="item-row-icon" style="background:${hexToRgba(catColor, 0.12)}; border:1px solid ${catColor}">
            ${iconContent}
          </div>
          <div class="item-row-info">
            <div class="item-row-title">${escapeHtml(l.title)}</div>
            <div class="item-row-sub">${escapeHtml(l.url)}</div>
          </div>
          <div class="item-row-actions">
            <button class="icon-btn" data-action="edit-link" data-id="${l.id}" title="Editar"><i data-lucide="pencil"></i></button>
            <button class="icon-btn danger" data-action="delete-link" data-id="${l.id}" title="Excluir"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
      `;
    }).join('');
    lucide.createIcons();
  }

  function renderAdminCategories() {
    const list = document.getElementById('categoriesList');
    if (data.categories.length === 0) {
      list.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-faint); font-size:13px;">Nenhuma categoria cadastrada</div>';
      return;
    }
    list.innerHTML = data.categories.map(c => {
      const count = data.links.filter(l => l.categoryId === c.id).length;
      return `
        <div class="item-row">
          <div class="item-row-icon" style="background:${c.color}"></div>
          <div class="item-row-info">
            <div class="item-row-title">${escapeHtml(c.name)}</div>
            <div class="item-row-sub">${count} acesso${count !== 1 ? 's' : ''}</div>
          </div>
          <div class="item-row-actions">
            <button class="icon-btn" data-action="edit-category" data-id="${c.id}" title="Editar"><i data-lucide="pencil"></i></button>
            <button class="icon-btn danger" data-action="delete-category" data-id="${c.id}" title="Excluir"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
      `;
    }).join('');
    lucide.createIcons();
  }

  // ===== LINK EDITOR =====
  function openLinkEditor() {
    editingLinkId = null;
    selectedImage = null;
    document.getElementById('linkEditorTitle').textContent = 'Novo acesso';
    document.getElementById('linkTitle').value = '';
    document.getElementById('linkUrl').value = '';
    document.getElementById('linkDesc').value = '';
    populateCategorySelect();
    updateImagePreview();
    openModal('linkEditorModal');
  }

  function editLink(id) {
    const link = data.links.find(l => l.id === id);
    if (!link) return;
    editingLinkId = id;
    selectedImage = link.image;
    document.getElementById('linkEditorTitle').textContent = 'Editar acesso';
    document.getElementById('linkTitle').value = link.title;
    document.getElementById('linkUrl').value = link.url;
    document.getElementById('linkDesc').value = link.desc || '';
    populateCategorySelect(link.categoryId);
    updateImagePreview();
    openModal('linkEditorModal');
  }

  function populateCategorySelect(selectedId) {
    const select = document.getElementById('linkCategory');
    select.innerHTML = data.categories.map(c =>
      `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${escapeHtml(c.name)}</option>`
    ).join('');
  }

  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      toast('Imagem muito grande (máx 2MB)', 'error');
      return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
      selectedImage = ev.target.result;
      updateImagePreview();
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    selectedImage = null;
    document.getElementById('linkImage').value = '';
    updateImagePreview();
  }

  function updateImagePreview() {
    const preview = document.getElementById('imagePreview');
    if (selectedImage) {
      preview.innerHTML = `<img src="${selectedImage}" alt=""/>`;
    } else {
      preview.innerHTML = '<i data-lucide="image"></i>';
      lucide.createIcons();
    }
  }

  function saveLink() {
    const title = document.getElementById('linkTitle').value.trim();
    const url = document.getElementById('linkUrl').value.trim();
    const desc = document.getElementById('linkDesc').value.trim();
    const categoryId = document.getElementById('linkCategory').value;

    if (!title) { toast('Informe o título', 'error'); return; }
    if (!url) { toast('Informe a URL', 'error'); return; }
    if (!categoryId) { toast('Selecione uma categoria', 'error'); return; }

    const normalizedUrl = url.match(/^https?:\/\//) ? url : 'https://' + url;

    if (editingLinkId) {
      const idx = data.links.findIndex(l => l.id === editingLinkId);
      data.links[idx] = { ...data.links[idx], title, url: normalizedUrl, desc, categoryId, image: selectedImage };
    } else {
      data.links.push({
        id: 'l' + Date.now(),
        title, url: normalizedUrl, desc, categoryId, image: selectedImage
      });
    }
    saveData();
    render();
    renderAdminLinks();
    renderAdminCategories();
    closeModal('linkEditorModal');
    toast('Acesso salvo', 'success');
  }

  function deleteLink(id) {
    if (!confirm('Excluir este acesso?')) return;
    data.links = data.links.filter(l => l.id !== id);
    saveData();
    render();
    renderAdminLinks();
    renderAdminCategories();
    toast('Acesso excluído', 'success');
  }

  // ===== CATEGORY EDITOR =====
  function openCategoryEditor() {
    editingCategoryId = null;
    selectedColor = COLORS[0];
    document.getElementById('categoryEditorTitle').textContent = 'Nova categoria';
    document.getElementById('categoryName').value = '';
    renderColorPicker();
    openModal('categoryEditorModal');
  }

  function editCategory(id) {
    const cat = data.categories.find(c => c.id === id);
    if (!cat) return;
    editingCategoryId = id;
    selectedColor = cat.color;
    document.getElementById('categoryEditorTitle').textContent = 'Editar categoria';
    document.getElementById('categoryName').value = cat.name;
    renderColorPicker();
    openModal('categoryEditorModal');
  }

  function renderColorPicker() {
    const picker = document.getElementById('colorPicker');
    picker.innerHTML = COLORS.map(c =>
      `<div class="color-swatch ${c === selectedColor ? 'active' : ''}" style="background:${c}" data-action="select-color" data-color="${c}"></div>`
    ).join('');
  }

  function selectColor(c) {
    selectedColor = c;
    renderColorPicker();
  }

  function saveCategory() {
    const name = document.getElementById('categoryName').value.trim();
    if (!name) { toast('Informe o nome', 'error'); return; }

    if (editingCategoryId) {
      const idx = data.categories.findIndex(c => c.id === editingCategoryId);
      data.categories[idx] = { ...data.categories[idx], name, color: selectedColor };
    } else {
      data.categories.push({
        id: 'c' + Date.now(),
        name, color: selectedColor
      });
    }
    saveData();
    render();
    renderAdminCategories();
    renderAdminLinks();
    closeModal('categoryEditorModal');
    toast('Categoria salva', 'success');
  }

  function deleteCategory(id) {
    const hasLinks = data.links.some(l => l.categoryId === id);
    if (hasLinks) {
      if (!confirm('Esta categoria tem acessos vinculados. Eles também serão excluídos. Continuar?')) return;
      data.links = data.links.filter(l => l.categoryId !== id);
    } else {
      if (!confirm('Excluir esta categoria?')) return;
    }
    data.categories = data.categories.filter(c => c.id !== id);
    saveData();
    render();
    renderAdminCategories();
    renderAdminLinks();
    toast('Categoria excluída', 'success');
  }

  // ===== MODAL HELPERS =====
  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => {
      if (e.target === overlay) overlay.classList.remove('active');
    });
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(o => o.classList.remove('active'));
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      document.getElementById('searchInput').focus();
    }
  });

  // ===== TOAST =====
  let toastTimer;
  function toast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.className = 'toast show ' + type;
    document.getElementById('toastMessage').textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ===== CLOCK & GREETING =====
  function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const greet = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
    document.getElementById('greetingText').textContent = greet;
    document.getElementById('clock').textContent = now.toLocaleString('pt-BR', {
      day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ===== SEARCH =====
  document.getElementById('searchInput').addEventListener('input', render);

  // ===== UTILS =====
  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, s => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[s]));
  }
  function escapeAttr(str) { return escapeHtml(str); }
  function hexToRgba(hex, alpha) {
    const h = hex.replace('#', '');
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  // ===== EVENT DELEGATION (todos os cliques passam aqui) =====
  document.addEventListener('click', (e) => {
    const actionEl = e.target.closest('[data-action]');
    const closeEl = e.target.closest('[data-close]');

    if (closeEl) {
      closeModal(closeEl.dataset.close);
      return;
    }

    if (!actionEl) return;
    const action = actionEl.dataset.action;
    const id = actionEl.dataset.id;

    switch (action) {
      case 'do-login': tryLogin(); break;
      case 'new-link': openLinkEditor(); break;
      case 'edit-link': editLink(id); break;
      case 'delete-link': deleteLink(id); break;
      case 'save-link': saveLink(); break;
      case 'new-category': openCategoryEditor(); break;
      case 'edit-category': editCategory(id); break;
      case 'delete-category': deleteCategory(id); break;
      case 'save-category': saveCategory(); break;
      case 'select-color': selectColor(actionEl.dataset.color); break;
      case 'pick-image': document.getElementById('linkImage').click(); break;
      case 'clear-image': clearImage(); break;
    }
  });

  // File input listener (can't use delegation for change event reliably across browsers)
  document.getElementById('linkImage').addEventListener('change', handleImageUpload);

  // ===== INIT =====
  render();
  lucide.createIcons();
