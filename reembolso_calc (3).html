<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Reembolsos — RDY Supply</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --surface: #0f0f0f;
      --surface-light: #181818;
      --border: #222222;
      --primary: #ffcc00; 
      --success: #2e7d32;
      --text: #ffffff;
      --text-dim: #888888;
      --radius: 20px;
      --font: 'Inter', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { height: 64px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .header-title { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.03em; }
    .header-date { font-size: 0.75rem; color: var(--text-dim); font-weight: 500; }

    .app-container { display: grid; grid-template-columns: 320px 1fr; flex: 1; overflow: hidden; padding: 24px; gap: 24px; }

    .sidebar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; display: flex; flex-direction: column; gap: 28px; }
    .section-title { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    
    .filter-group { display: flex; flex-direction: column; gap: 10px; }
    .filter-group label { font-size: 0.65rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
    
    select, input { background: #080808; border: 1px solid var(--border); border-radius: 12px; color: var(--text); padding: 14px; font-family: var(--font); font-size: 0.9rem; outline: none; transition: all 0.2s; }
    select:focus, input:focus { border-color: var(--primary); background: #111; }

    .row-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .btn { width: 100%; padding: 16px; border-radius: 24px; border: none; font-weight: 900; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s; }
    .btn-import { background: var(--primary); color: #000; box-shadow: 0 4px 20px rgba(255,204,0,0.15); }
    .btn-import:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(255,204,0,0.25); }
    .btn-report { background: var(--success); color: #fff; box-shadow: 0 4px 20px rgba(46,125,50,0.15); }
    .btn-report:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(46,125,50,0.25); }
    .btn-clear { background: transparent; color: var(--text-dim); border: 1px solid var(--border); font-size: 0.75rem; padding: 12px; margin-top: 8px; }
    .btn-clear:hover { color: #fff; border-color: #555; }

    .content { display: flex; flex-direction: column; gap: 24px; overflow: hidden; }
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; transition: border-color 0.3s; }
    .kpi-card:hover { border-color: #333; }
    .kpi-label { font-size: 0.6rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.05em; }
    .kpi-value { font-family: var(--mono); font-size: 2rem; font-weight: 700; }
    .kpi-card.total .kpi-value { color: var(--primary); }

    .table-container { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .table-scroll { flex: 1; overflow: auto; padding: 32px; }
    
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; font-size: 0.7rem; font-weight: 900; color: var(--text-dim); text-transform: uppercase; padding-bottom: 24px; letter-spacing: 0.12em; position: sticky; top: 0; background: var(--surface); z-index: 10; }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.02); transition: background 0.1s; }
    tbody tr:hover { background: rgba(255,255,255,0.01); }
    tbody td { padding: 20px 0; font-size: 0.9rem; font-weight: 500; }
    .td-num { font-family: var(--mono); font-weight: 700; }
    .td-total { color: var(--primary); }
    .td-os { color: #4ade80; font-weight: 800; }

    .empty-state { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 0.95rem; font-weight: 500; pointer-events: none; }

    #file-input { display: none; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #333; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="material-symbols-outlined" style="cursor:pointer">menu</span>
    <h1 class="header-title">Calculadora de Reembolsos</h1>
  </div>
  <div class="header-date" id="header-date">-- de ---, --:--</div>
</header>

<div class="app-container">
  <aside class="sidebar">
    <div class="section-title">
      <span class="material-symbols-outlined">filter_alt</span>
      Filtros
    </div>

    <div class="filter-group">
      <label for="f-func">Funcionário</label>
      <select id="f-func" title="Selecionar Funcionário" onchange="renderCalc()">
        <option value="">(Todos)</option>
      </select>
    </div>

    <div class="row-filters">
      <div class="filter-group">
        <label for="f-tipo">Tipo</label>
        <select id="f-tipo" title="Selecionar Tipo" onchange="renderCalc()">
          <option value="">(Todos)</option>
          <option value="KM">KM</option>
          <option value="Avulso">Avulso</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="f-coef">Coef.</label>
        <select id="f-coef" title="Selecionar Coeficiente" onchange="renderCalc()">
          <option value="">(Todos)</option>
          <option value="1">Reemb. (=1)</option>
          <option value="0">Não reemb. (=0)</option>
        </select>
      </div>
    </div>

    <div class="filter-group">
      <label>Extras Manuais (R$)</label>
      <div class="flex-column gap-7">
        <input type="number" id="ex-Pedágio" placeholder="Pedágios..." value="0" step="0.01" oninput="renderCalc()">
        <input type="number" id="ex-estac" placeholder="Estac. / Outros..." value="0" step="0.01" oninput="renderCalc()">
      </div>
    </div>

    <div style="margin-top:auto; display:flex; flex-direction:column; gap:16px;">
      <button class="btn btn-import" onclick="document.getElementById('file-input').click()">
        <span class="material-symbols-outlined">upload_file</span>
        IMPORTAR XLSX
      </button>
      <input type="file" id="file-input" accept=".xlsx,.xls,.csv" onchange="handleFile(event)">
      
      <button class="btn btn-report" onclick="exportXLSX()">
        <span class="material-symbols-outlined">description</span>
        GERAR RELATÓRIO
      </button>

      <button class="btn btn-clear" onclick="resetFilters()">
        LIMPAR FILTROS
      </button>
    </div>
  </aside>

  <main class="content">
    <div class="kpi-grid">
      <div class="kpi-card total">
        <div class="kpi-label">Total Reembolso</div>
        <div class="kpi-value" id="kv-grand">R$ 0,00</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Custo KM (VAR)</div>
        <div class="kpi-value" id="kv-var">R$ 0,00</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Custo Fixo (CASA)</div>
        <div class="kpi-value" id="kv-casa">R$ 0,00</div>
      </div>
    </div>

    <div class="table-container">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Funcionário</th>
              <th style="text-align:right">Custo KM</th>
              <th style="text-align:right">Fixo</th>
              <th style="text-align:right">Pedágios</th>
              <th style="text-align:right">Estac.</th>
              <th style="text-align:right">Total</th>
              <th style="text-align:right">OS</th>
            </tr>
          </thead>
          <tbody id="calc-tbody"></tbody>
        </table>
      </div>
      <div id="empty-state" class="empty-state">
        Aguardando importação de dados...
      </div>
    </div>
  </main>
</div>

<script>
  let rawData = [], headers = [];
  const COL = {};
  const COL_MAP = {
    func:    ['funcionário','funcionario'],
    valor:   ['valor'],
    coef:    ['coeficiente'],
    tipo:    ['tipo (km'],
    pi:      ['ponto inicial'],
    pf:      ['ponto final'],
    osPFin:  ['os personalizada final'],
    cargo:   ['cargo']
  };

  function updateTime() {
    const now = new Date();
    const opts = { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' };
    document.getElementById('header-date').textContent = now.toLocaleDateString('pt-BR', opts).replace('.','');
  }
  setInterval(updateTime, 1000); updateTime();

  function detectColumns(hdrs) {
    Object.keys(COL_MAP).forEach(k => COL[k] = null);
    hdrs.forEach((h, i) => {
      const lc = String(h||'').toLowerCase().trim();
      Object.entries(COL_MAP).forEach(([key, patterns]) => {
        if (COL[key] === null && patterns.some(p => lc.startsWith(p) || lc === p)) COL[key] = i;
      });
    });
  }

  function handleFile(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(ev.target.result, {type:'binary', cellDates:true});
        const sn = wb.SheetNames.includes('reembolsos') ? 'reembolsos' : wb.SheetNames[0];
        loadArray(XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:null}));
      } catch(err) { alert('Erro: ' + err.message); }
    };
    reader.readAsBinaryString(file);
    e.target.value = '';
  }

  function loadArray(arr) {
    if (!arr || arr.length < 2) { alert('Arquivo inválido.'); return; }
    headers = arr[0].map(h => String(h??'').trim());
    detectColumns(headers);
    rawData = arr.slice(1).map(row => {
      const obj = {}; headers.forEach((h,i) => { obj[h] = row[i]??null; }); return obj;
    }).filter(r => headers.some(h => r[h]!==null && r[h]!==''));
    updateFuncFilter(); renderCalc();
  }

  function updateFuncFilter() {
    const sel = document.getElementById('f-func'), prev = sel.value;
    const funcs = COL.func!==null ? [...new Set(rawData.map(r=>r[headers[COL.func]]).filter(Boolean))].sort() : [];
    sel.innerHTML = '<option value="">(Todos)</option>' + funcs.map(f=>`<option${f===prev?' selected':''}>${f}</option>`).join('');
  }

  function gv(row,col){ return col===null ? null : row[headers[col]]; }
  function pn(v){ if(v===null||v===undefined||v==='')return 0; const n=parseFloat(v); return isNaN(n)?0:n; }
  function fmt(v){ return 'R$ ' + v.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }

  function renderCalc() {
    const empty = document.getElementById('empty-state');
    if (rawData.length === 0) { empty.style.display = 'flex'; return; }
    empty.style.display = 'none';

    const fFunc = document.getElementById('f-func').value;
    const fTipo = document.getElementById('f-tipo').value;
    const fCoef = document.getElementById('f-coef').value;
    const exPed = pn(document.getElementById('ex-Pedágio').value);
    const exEst = pn(document.getElementById('ex-estac').value);

    const filtered = rawData.filter(row => {
      if(fFunc && gv(row, COL.func)!==fFunc) return false;
      if(fTipo && gv(row, COL.tipo)!==fTipo) return false;
      if(fCoef !== '') { const c = gv(row, COL.coef); if(String(c)!==fCoef && pn(c)!==pn(fCoef)) return false; }
      return true;
    });

    const byFunc = {};
    filtered.forEach(row => {
      const name = String(gv(row, COL.func) ?? 'Sem Nome');
      if(!byFunc[name]) byFunc[name] = { total:0, var:0, casa:0, count:0, os: new Set() };
      const val = pn(gv(row, COL.valor)), coef = pn(gv(row, COL.coef));
      const os = String(gv(row, COL.osPFin)??'').trim();
      if(os && os!=='-') byFunc[name].os.add(os);
      if(coef === 1) {
        const isCasa = String(gv(row, COL.pi)??'').includes('Casa do Usuário') || String(gv(row, COL.pf)??'').includes('Casa do Usuário');
        byFunc[name].total += val;
        if(isCasa) byFunc[name].casa += val; else byFunc[name].var += val;
      }
    });

    const sorted = Object.entries(byFunc).sort((a,b) => b[1].total - a[1].total);
    let gTotal = 0, gVar = 0, gCasa = 0;
    sorted.forEach(([,d]) => { gTotal += d.total; gVar += d.var; gCasa += d.casa; });

    document.getElementById('kv-grand').textContent = fmt(gTotal + exPed + exEst);
    document.getElementById('kv-var').textContent = fmt(gVar);
    document.getElementById('kv-casa').textContent = fmt(gCasa);

    const totalAll = gTotal;
    document.getElementById('calc-tbody').innerHTML = sorted.map(([name, d]) => {
      const ratio = totalAll > 0 ? d.total / totalAll : (sorted.length > 0 ? 1/sorted.length : 0);
      const ped = exPed * ratio, est = exEst * ratio, total = d.total + ped + est;
      return `<tr>
        <td>${name}</td>
        <td class="td-num" style="text-align:right">${fmt(d.var)}</td>
        <td class="td-num" style="text-align:right">${fmt(d.casa)}</td>
        <td class="td-num" style="text-align:right; color: var(--text-dim)">${fmt(ped)}</td>
        <td class="td-num" style="text-align:right; color: var(--text-dim)">${fmt(est)}</td>
        <td class="td-num td-total" style="text-align:right">${fmt(total)}</td>
        <td class="td-num td-os" style="text-align:right">${d.os.size}</td>
      </tr>`;
    }).join('');
  }

  function resetFilters() {
    document.getElementById('f-func').value = '';
    document.getElementById('f-tipo').value = '';
    document.getElementById('f-coef').value = '';
    document.getElementById('ex-Pedágio').value = '0';
    document.getElementById('ex-estac').value = '0';
    renderCalc();
  }

  // --- EXPORT LOGIC ---
  function exportXLSX() {
    if (rawData.length === 0) { alert('Sem dados para exportar.'); return; }
    const exPed = pn(document.getElementById('ex-Pedágio').value);
    const exEst = pn(document.getElementById('ex-estac').value);
    const byFunc = {};
    rawData.forEach(row => {
      const func = String(gv(row, COL.func) ?? '');
      const osVal = String(gv(row, COL.osPFin) ?? '').trim();
      if (!func) return;
      if (!byFunc[func]) byFunc[func] = { total:0, var:0, casa:0, os: new Set() };
      if (osVal && osVal !== '-' && osVal !== '') byFunc[func].os.add(osVal);
      if (pn(gv(row, COL.coef)) === 1) {
        const val = pn(gv(row, COL.valor));
        const isCasa = String(gv(row, COL.pi)??'').includes('Casa do Usuário') || String(gv(row, COL.pf)??'').includes('Casa do Usuário');
        byFunc[func].total += val;
        if(isCasa) byFunc[func].casa += val; else byFunc[func].var += val;
      }
    });

    const sorted = Object.entries(byFunc).sort((a, b) => a[0].localeCompare(b[0], 'pt-BR'));
    const totalAll = sorted.reduce((s, [, d]) => s + d.total, 0);
    const grandTotal = totalAll + exPed + exEst;

    const wb = XLSX.utils.book_new();
    const data = sorted.map(([name, d]) => {
      const ratio = totalAll > 0 ? d.total / totalAll : 0;
      return {
        'Técnico': name,
        'Custo Fixo': d.casa,
        'Custo Variável': d.var,
        'Extras': (exPed + exEst) * ratio,
        'TOTAL': d.total + ((exPed + exEst) * ratio),
        'OS Atendidas': d.os.size
      };
    });
    const ws = XLSX.utils.json_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, "Reembolsos");
    XLSX.writeFile(wb, "Relatorio_Reembolsos.xlsx");
  }
</script>
<script>
  function syncTheme() {
    try {
      const parentDoc = window.parent.document.documentElement;
      const theme = parentDoc.getAttribute('data-theme') || 'dark';
      const accent = parentDoc.getAttribute('data-accent') || 'gold';
      
      document.documentElement.setAttribute('data-theme', theme);
      
      const colors = {
        gold:    { primary: '#ffcc00' },
        magenta: { primary: '#ff0090' },
        blue:    { primary: '#00b0ff' }
      };
      
      const sel = colors[accent] || colors.gold;
      const root = document.documentElement;
      root.style.setProperty('--primary', sel.primary);
      
      if (theme === 'light') {
        document.body.style.background = '#f5f6f8';
        document.body.style.color = '#000000';
        document.querySelectorAll('.card, .panel, input, select').forEach(el => {
          el.style.background = '#ffffff';
          el.style.color = '#000000';
          el.style.borderColor = '#dddddd';
        });
      } else {
        document.body.style.background = '#000000';
        document.body.style.color = '#ffffff';
        document.querySelectorAll('.card, .panel, input, select').forEach(el => {
          el.style.background = '#0f0f0f';
          el.style.color = '#ffffff';
          el.style.borderColor = '#333333';
        });
      }
    } catch (e) {}
  }
  if (window.parent !== window) {
    const observer = new MutationObserver(syncTheme);
    observer.observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-accent'] });
    syncTheme();
  }
</script>
</body>
</html>
