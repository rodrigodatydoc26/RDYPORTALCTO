<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-accent="gold">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Reembolsos — RDY Supply</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --accent:        #FFD700;
      --accent-soft:   rgba(255,215,0,0.12);
      --accent-glow:   rgba(255,215,0,0.35);
      --bg:            #050505;
      --surface:       #0E0E0E;
      --surface2:      #161616;
      --surface3:      #1E1E1E;
      --border:        rgba(255,255,255,0.06);
      --border-strong: rgba(255,255,255,0.12);
      --text:          #FFFFFF;
      --text-dim:      rgba(255,255,255,0.45);
      --text-faint:    rgba(255,255,255,0.22);
      --success:       #00C853;
      --danger:        #FF1744;
      --radius:        16px;
      --radius-sm:     10px;
      --sidebar-w:     280px;
      --header-h:      68px;
      --shadow:        0 20px 60px -20px rgba(0,0,0,0.8);
    }
    [data-theme="light"] {
      --bg:            #F5F6F8;
      --surface:       #FFFFFF;
      --surface2:      #F0F1F4;
      --surface3:      #E8E9ED;
      --border:        rgba(0,0,0,0.07);
      --border-strong: rgba(0,0,0,0.14);
      --text:          #0D0D0F;
      --text-dim:      rgba(0,0,0,0.45);
      --text-faint:    rgba(0,0,0,0.28);
      --shadow:        0 8px 32px -8px rgba(0,0,0,0.12);
    }
    [data-accent="magenta"] { 
      --accent:#FF0090;
      --accent-soft:rgba(255,0,144,0.12);
      --accent-glow:rgba(255,0,144,0.35); 
    }
    [data-accent="blue"] { 
      --accent:#00B0FF;
      --accent-soft:rgba(0,176,255,0.12);
      --accent-glow:rgba(0,176,255,0.35); 
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }       
    @keyframes spin { to { transform: rotate(360deg); } }

    * { box-sizing:border-box; margin:0; padding:0; letter-spacing:-0.02em; }
    html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }

    .sidebar {
      width:var(--sidebar-w); height:100vh;
      background:var(--surface); border-right:1px solid var(--border);  
      display:flex; flex-direction:column; flex-shrink:0;
      position:fixed; left:0; top:0; z-index:50;
      transition:width 0.3s cubic-bezier(0.4,0,0.2,1); overflow:hidden; 
    }
    .sidebar.collapsed { width:72px; }
    .sidebar-header {
      height:var(--header-h); padding:0 20px;
      display:flex; align-items:center; gap:12px;
      border-bottom:1px solid var(--border); flex-shrink:0;
    }
    .sidebar-logo-mark {
      width:36px; height:36px; border-radius:10px;
      background:var(--accent); color:#000;
      font-family:'Syne',sans-serif; font-weight:900; font-size:18px;   
      display:grid; place-items:center; flex-shrink:0;
      box-shadow:0 4px 16px var(--accent-glow);
    }
    .sidebar-brand { display:flex; flex-direction:column; white-space:nowrap; transition:opacity 0.2s; }
    .sidebar.collapsed .sidebar-brand { opacity:0; pointer-events:none; }
    .sidebar-brand-name { font-family:'Syne',sans-serif; font-weight:800; font-size:15px; letter-spacing:0.05em; text-transform:uppercase; }
    .sidebar-brand-sub  { font-size:10px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; letter-spacing:0.1em; text-transform:uppercase; }
    
    .sidebar-nav { flex:1; padding:16px 12px; display:flex; flex-direction:column; gap:4px; overflow-y:auto; }
    .nav-group-label { font-size:10px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.12em; padding:12px 8px 6px; }
    .sidebar.collapsed .nav-group-label { opacity:0; }
    
    .sidebar-footer { padding:16px 12px; border-top:1px solid var(--border); flex-shrink:0; }
    
    .topbar {
      position:fixed; top:0; left:var(--sidebar-w); right:0;
      height:var(--header-h); background:var(--surface);
      border-bottom:1px solid var(--border); z-index:40;
      display:flex; align-items:center; gap:16px; padding:0 28px;       
      transition:left 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    .sidebar-toggled .topbar { left:72px; }
    .topbar-toggle {
      width:36px; height:36px; border-radius:10px;
      background:transparent; border:1px solid var(--border); color:var(--text-dim);
      cursor:pointer; display:grid; place-items:center; transition:all 0.18s;
    }
    .topbar-toggle:hover { background:var(--surface2); color:var(--text); }
    .topbar-toggle svg { width:18px; height:18px; }
    .topbar-title { font-family:'Syne',sans-serif; font-weight:700; font-size:17px; white-space:nowrap; }
    .topbar-right { display:flex; align-items:center; gap:10px; margin-left:auto; }
    .clock-display { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); white-space:nowrap; }        
    .accent-picker { display:flex; gap:6px; align-items:center; }       
    .accent-swatch { width:20px; height:20px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:all 0.18s; }
    .accent-swatch.active { border-color:var(--text); transform:scale(1.2); }
    .accent-swatch[data-accent="gold"]    { background:#FFD700; }       
    .accent-swatch[data-accent="magenta"] { background:#FF0090; }       
    .accent-swatch[data-accent="blue"]    { background:#00B0FF; }       
    .theme-btn { width:36px; height:36px; border-radius:10px; background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); cursor:pointer; display:grid; place-items:center; transition:all 0.18s; }
    .theme-btn:hover { color:var(--accent); border-color:var(--accent); }
    .theme-btn svg { width:16px; height:16px; }

    .main-canvas {
      margin-left:var(--sidebar-w); margin-top:var(--header-h);
      height:calc(100vh - var(--header-h)); overflow-y:auto;
      padding:32px 36px 60px;
      transition:margin-left 0.3s cubic-bezier(0.4,0,0.2,1);
      animation:fadeUp 0.4s ease;
    }
    .sidebar-toggled .main-canvas { margin-left:72px; }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--accent); }       

    .card {
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; position:relative; overflow:hidden;
      transition:all 0.3s cubic-bezier(0.2,0.8,0.2,1);
    }
    .card:hover { transform:translateY(-3px); border-color:var(--accent); box-shadow:0 16px 48px -12px var(--accent-glow); }
    .card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--accent); opacity:0; transition:opacity 0.3s; }
    .card:hover::before { opacity:1; }

    .btn-primary { background:var(--accent); color:#000; font-weight:700; border:none; border-radius:var(--radius-sm); padding:10px 18px; cursor:pointer; transition:all 0.18s; font-family:'Inter',sans-serif; text-transform:uppercase; font-size:12px; letter-spacing:0.05em; display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-primary:hover { box-shadow:0 6px 20px -6px var(--accent-glow); transform:translateY(-1px); }
    
    .btn-secondary { background:var(--surface2); color:var(--text); font-weight:600; border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 18px; cursor:pointer; transition:all 0.18s; font-family:'Inter',sans-serif; text-transform:uppercase; font-size:11px; letter-spacing:0.05em; }
    .btn-secondary:hover { background:var(--surface3); }

    /* Custom styles for calculator elements */
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
    .kpi-label { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.05em; }
    .kpi-value { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; color: var(--text); }
    .kpi-card.total .kpi-value { color: var(--accent); }

    .filter-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .filter-group label { font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
    
    select, input { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: 13px; outline: none; transition: all 0.2s; width: 100%; }
    select:focus, input:focus { border-color: var(--accent); background: var(--surface3); }

    .row-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .table-container { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .table-scroll { overflow: auto; max-height: 600px; }
    
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; font-size: 11px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; padding: 16px 24px; letter-spacing: 0.08em; position: sticky; top: 0; background: var(--surface2); z-index: 10; border-bottom: 1px solid var(--border); }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 14px 24px; font-size: 13px; font-weight: 500; color: var(--text); }
    
    .td-num { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
    .td-total { color: var(--accent); font-weight: 700; }
    .td-os { color: var(--success); font-weight: 700; }

    .empty-state { padding: 60px; text-align: center; color: var(--text-dim); font-size: 14px; font-weight: 500; }
    
    .sidebar-section-title { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 800; color: var(--text); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .sidebar-section-title i { width: 16px; height: 16px; color: var(--accent); }

    #file-input { display: none; }
    
    .flex-column { display: flex; flex-direction: column; }
    .gap-7 { gap: 7px; }
    .mb-20 { margin-bottom: 20px; }
  </style>
</head>
<body class="">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo-mark">C</div>
      <div class="sidebar-brand">
        <div class="sidebar-brand-name">Calculadora</div>
        <div class="sidebar-brand-sub">RDY Supply</div>
      </div>
    </div>
    <div class="sidebar-nav">
      
      <div class="sidebar-section-title" style="padding: 12px 8px 4px;">
        <i data-lucide="filter"></i> Filtros
      </div>

      <div style="padding: 8px;">
        <div class="filter-group">
          <label for="f-func">Funcionário</label>
          <select id="f-func" title="Selecionar Funcionário" onchange="renderCalc()">
            <option value="">(Todos)</option>
          </select>
        </div>

        <div class="row-filters">
          <div class="filter-group">
            <label for="f-tipo">Tipo</label>
            <select id="f-tipo" title="Selecionar Tipo" onchange="renderCalc()">
              <option value="">(Todos)</option>
              <option value="KM">KM</option>
              <option value="Avulso">Avulso</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="f-coef">Coef.</label>
            <select id="f-coef" title="Selecionar Coeficiente" onchange="renderCalc()">
              <option value="">(Todos)</option>
              <option value="1">Reemb. (=1)</option>
              <option value="0">Não reemb. (=0)</option>
            </select>
          </div>
        </div>

        <div class="filter-group">
          <label>Extras Manuais (R$)</label>
          <div class="flex-column gap-7">
            <input type="number" id="ex-Pedágio" placeholder="Pedágios..." value="0" step="0.01" oninput="renderCalc()">
            <input type="number" id="ex-estac" placeholder="Estac. / Outros..." value="0" step="0.01" oninput="renderCalc()">
          </div>
        </div>
      </div>

      <div class="nav-group-label">Ações</div>
      <div style="padding: 8px; display: flex; flex-direction: column; gap: 10px;">
        <button class="btn-primary" onclick="document.getElementById('file-input').click()" style="width: 100%;">
          <i data-lucide="upload"></i> IMPORTAR XLSX
        </button>
        <input type="file" id="file-input" accept=".xlsx,.xls,.csv" onchange="handleFile(event)">
        
        <button class="btn-primary" onclick="exportXLSX()" style="width: 100%; background: var(--success);">
          <i data-lucide="file-text"></i> GERAR RELATÓRIO
        </button>

        <button class="btn-secondary" onclick="resetFilters()" style="width: 100%;">
          LIMPAR FILTROS
        </button>
      </div>

    </div>
    <div class="sidebar-footer">
      <button class="sidebar-link">
        <i data-lucide="help-circle"></i>
        <span>Suporte</span>
      </button>
    </div>
  </aside>

  <header class="topbar">
    <button class="topbar-toggle" onclick="toggleSidebar()" title="Menu">
      <i data-lucide="menu"></i>
    </button>
    <div class="topbar-title" id="topbar-title">Calculadora de Reembolsos</div>   
    <div class="topbar-right">
      <div class="clock-display" id="topbar-clock"></div>
      <div class="accent-picker">
        <div class="accent-swatch active" data-accent="gold" title="Dourado"></div>
        <div class="accent-swatch" data-accent="magenta" title="Magenta"></div>
        <div class="accent-swatch" data-accent="blue" title="Azul"></div>
      </div>
      <button class="theme-btn" id="theme-btn" title="Alternar tema"> 
        <i data-lucide="moon"></i>
      </button>
    </div>
  </header>

  <main class="main-canvas">
    
    <div class="kpi-grid">
      <div class="card kpi-card total">
        <div class="kpi-label">Total Reembolso</div>
        <div class="kpi-value" id="kv-grand">R$ 0,00</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Custo KM (VAR)</div>
        <div class="kpi-value" id="kv-var">R$ 0,00</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Custo Fixo (CASA)</div>
        <div class="kpi-value" id="kv-casa">R$ 0,00</div>
      </div>
    </div>

    <div class="table-container card" style="padding: 0;">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Funcionário</th>
              <th style="text-align:right">Custo KM</th>
              <th style="text-align:right">Fixo</th>
              <th style="text-align:right">Pedágios</th>
              <th style="text-align:right">Estac.</th>
              <th style="text-align:right">Total</th>
              <th style="text-align:right">OS</th>
            </tr>
          </thead>
          <tbody id="calc-tbody"></tbody>
        </table>
      </div>
      <div id="empty-state" class="empty-state">
        Aguardando importação de dados...
      </div>
    </div>

  </main>

  <script>
    let rawData = [], headers = [];
    const COL = {};
    const COL_MAP = {
      func:    ['funcionário','funcionario'],
      valor:   ['valor'],
      coef:    ['coeficiente'],
      tipo:    ['tipo (km'],
      pi:      ['ponto inicial'],
      pf:      ['ponto final'],
      osPFin:  ['os personalizada final'],
      cargo:   ['cargo']
    };

    // Note: Removed the local updateTime to use the mandatory one
    
    function detectColumns(hdrs) {
      Object.keys(COL_MAP).forEach(k => COL[k] = null);
      hdrs.forEach((h, i) => {
        const lc = String(h||'').toLowerCase().trim();
        Object.entries(COL_MAP).forEach(([key, patterns]) => {
          if (COL[key] === null && patterns.some(p => lc.startsWith(p) || lc === p)) COL[key] = i;
        });
      });
    }

    function handleFile(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const wb = XLSX.read(ev.target.result, {type:'binary', cellDates:true});
          const sn = wb.SheetNames.includes('reembolsos') ? 'reembolsos' : wb.SheetNames[0];
          loadArray(XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:null}));
        } catch(err) { alert('Erro: ' + err.message); }
      };
      reader.readAsBinaryString(file);
      e.target.value = '';
    }

    function loadArray(arr) {
      if (!arr || arr.length < 2) { alert('Arquivo inválido.'); return; }
      headers = arr[0].map(h => String(h??'').trim());
      detectColumns(headers);
      rawData = arr.slice(1).map(row => {
        const obj = {}; headers.forEach((h,i) => { obj[h] = row[i]??null; }); return obj;
      }).filter(r => headers.some(h => r[h]!==null && r[h]!==''));
      updateFuncFilter(); renderCalc();
    }

    function updateFuncFilter() {
      const sel = document.getElementById('f-func'), prev = sel.value;
      const funcs = COL.func!==null ? [...new Set(rawData.map(r=>r[headers[COL.func]]).filter(Boolean))].sort() : [];
      sel.innerHTML = '<option value="">(Todos)</option>' + funcs.map(f=>`<option${f===prev?' selected':''}>${f}</option>`).join('');
    }

    function gv(row,col){ return col===null ? null : row[headers[col]]; }
    function pn(v){ if(v===null||v===undefined||v==='')return 0; const n=parseFloat(v); return isNaN(n)?0:n; }
    function fmt(v){ return 'R$ ' + v.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }

    function renderCalc() {
      const empty = document.getElementById('empty-state');
      if (rawData.length === 0) { empty.style.display = 'block'; return; }
      empty.style.display = 'none';

      const fFunc = document.getElementById('f-func').value;
      const fTipo = document.getElementById('f-tipo').value;
      const fCoef = document.getElementById('f-coef').value;
      const exPed = pn(document.getElementById('ex-Pedágio').value);
      const exEst = pn(document.getElementById('ex-estac').value);

      const filtered = rawData.filter(row => {
        if(fFunc && gv(row, COL.func)!==fFunc) return false;
        if(fTipo && gv(row, COL.tipo)!==fTipo) return false;
        if(fCoef !== '') { const c = gv(row, COL.coef); if(String(c)!==fCoef && pn(c)!==pn(fCoef)) return false; }
        return true;
      });

      const byFunc = {};
      filtered.forEach(row => {
        const name = String(gv(row, COL.func) ?? 'Sem Nome');
        if(!byFunc[name]) byFunc[name] = { total:0, var:0, casa:0, count:0, os: new Set() };
        const val = pn(gv(row, COL.valor)), coef = pn(gv(row, COL.coef));
        const os = String(gv(row, COL.osPFin)??'').trim();
        if(os && os!=='-') byFunc[name].os.add(os);
        if(coef === 1) {
          const isCasa = String(gv(row, COL.pi)??'').includes('Casa do Usuário') || String(gv(row, COL.pf)??'').includes('Casa do Usuário');
          byFunc[name].total += val;
          if(isCasa) byFunc[name].casa += val; else byFunc[name].var += val;
        }
      });

      const sorted = Object.entries(byFunc).sort((a,b) => b[1].total - a[1].total);
      let gTotal = 0, gVar = 0, gCasa = 0;
      sorted.forEach(([,d]) => { gTotal += d.total; gVar += d.var; gCasa += d.casa; });

      document.getElementById('kv-grand').textContent = fmt(gTotal + exPed + exEst);
      document.getElementById('kv-var').textContent = fmt(gVar);
      document.getElementById('kv-casa').textContent = fmt(gCasa);

      const totalAll = gTotal;
      document.getElementById('calc-tbody').innerHTML = sorted.map(([name, d]) => {
        const ratio = totalAll > 0 ? d.total / totalAll : (sorted.length > 0 ? 1/sorted.length : 0);
        const ped = exPed * ratio, est = exEst * ratio, total = d.total + ped + est;
        return `<tr>
          <td>${name}</td>
          <td class="td-num" style="text-align:right">${fmt(d.var)}</td>
          <td class="td-num" style="text-align:right">${fmt(d.casa)}</td>
          <td class="td-num" style="text-align:right; color: var(--text-dim)">${fmt(ped)}</td>
          <td class="td-num" style="text-align:right; color: var(--text-dim)">${fmt(est)}</td>
          <td class="td-num td-total" style="text-align:right">${fmt(total)}</td>
          <td class="td-num td-os" style="text-align:right">${d.os.size}</td>
        </tr>`;
      }).join('');
    }

    function resetFilters() {
      document.getElementById('f-func').value = '';
      document.getElementById('f-tipo').value = '';
      document.getElementById('f-coef').value = '';
      document.getElementById('ex-Pedágio').value = '0';
      document.getElementById('ex-estac').value = '0';
      renderCalc();
    }

    function exportXLSX() {
      if (rawData.length === 0) { alert('Sem dados para exportar.'); return; }
      const exPed = pn(document.getElementById('ex-Pedágio').value);
      const exEst = pn(document.getElementById('ex-estac').value);
      const byFunc = {};
      rawData.forEach(row => {
        const func = String(gv(row, COL.func) ?? '');
        const osVal = String(gv(row, COL.osPFin) ?? '').trim();
        if (!func) return;
        if (!byFunc[func]) byFunc[func] = { total:0, var:0, casa:0, os: new Set() };
        if (osVal && osVal !== '-' && osVal !== '') byFunc[func].os.add(osVal);
        if (pn(gv(row, COL.coef)) === 1) {
          const val = pn(gv(row, COL.valor));
          const isCasa = String(gv(row, COL.pi)??'').includes('Casa do Usuário') || String(gv(row, COL.pf)??'').includes('Casa do Usuário');
          byFunc[func].total += val;
          if(isCasa) byFunc[func].casa += val; else byFunc[func].var += val;
        }
      });

      const sorted = Object.entries(byFunc).sort((a, b) => a[0].localeCompare(b[0], 'pt-BR'));
      const totalAll = sorted.reduce((s, [, d]) => s + d.total, 0);

      const wb = XLSX.utils.book_new();
      const data = sorted.map(([name, d]) => {
        const ratio = totalAll > 0 ? d.total / totalAll : 0;
        return {
          'Técnico': name,
          'Custo Fixo': d.casa,
          'Custo Variável': d.var,
          'Extras': (exPed + exEst) * ratio,
          'TOTAL': d.total + ((exPed + exEst) * ratio),
          'OS Atendidas': d.os.size
        };
      });
      const ws = XLSX.utils.json_to_sheet(data);
      XLSX.utils.book_append_sheet(wb, ws, "Reembolsos");
      XLSX.writeFile(wb, "Relatorio_Reembolsos.xlsx");
    }
  </script>

  <script>
  (function(){
    const html = document.documentElement;
    // Clock
    function tick() {
      const el = document.getElementById('topbar-clock');
      if(el) el.textContent = new Date().toLocaleTimeString('pt-BR'); 
    }
    tick(); setInterval(tick, 1000);
    // Theme
    const themeBtn = document.getElementById('theme-btn');
    if(themeBtn) themeBtn.addEventListener('click', function(){       
      const t = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', t);
      if(window.lucide) lucide.createIcons();
    });
    // Accent
    document.querySelectorAll('.accent-swatch').forEach(function(s){  
      s.addEventListener('click', function(){
        html.setAttribute('data-accent', this.dataset.accent);        
        document.querySelectorAll('.accent-swatch').forEach(function(x){ x.classList.remove('active'); });
        this.classList.add('active');
      });
    });
    // Sidebar toggle
    function toggleSidebar(){
      document.querySelector('.sidebar').classList.toggle('collapsed');   
      document.body.classList.toggle('sidebar-toggled');
    }
    window.toggleSidebar = toggleSidebar;
    // Lucide icons
    if(window.lucide) lucide.createIcons();
    // Theme sync com parent (quando em iframe)
    window.addEventListener('message', function(e){
      if(e.data && e.data.type === 'setTheme') html.setAttribute('data-theme', e.data.theme);
      if(e.data && e.data.type === 'setAccent') html.setAttribute('data-accent', e.data.accent);
    });
  })();
  </script>
</body>
