<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Reembolsos — RDY Supply</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    /* ═══════════════════════════════════════════
       DESIGN TOKENS — PORTAL THEME SYSTEM
    ══════════════════════════════════════════ */
    :root {
      --bg:        #000000;
      --bg-card:   #080808;
      --surface:   #0A0A0A;
      --surface-h: #151515;
      --border:    rgba(255,255,255,0.08);
      --accent:    #CC0000;
      --text:      #FFFFFF;
      --text-dim:  rgba(255,255,255,0.7);
      --text-faint:rgba(255,255,255,0.3);
      --success:   #00C853;
      --radius:    32px;
      --font:      'Outfit', sans-serif;
      --topbar-h:  80px;
      --shadow:    0 30px 60px -12px rgba(0,0,0,0.5);
      --shadow-sm: 0 8px 32px rgba(0,0,0,0.3);
    }

    [data-theme="dark"]  { --surface-rgb: 10, 10, 10; }
    [data-theme="light"] {
      --bg:        #F8F9FA;
      --bg-card:   #FFFFFF;
      --surface:   #FFFFFF;
      --surface-rgb: 255, 255, 255;
      --surface-h: #F8F9FA;
      --text:      #111111;
      --text-dim:  #444444;
      --text-faint:#888888;
      --border:    rgba(0,0,0,0.03);
    }

    /* ── THEME PICKER ── */
    .theme-picker { display: flex; align-items: center; gap: 12px; }
    .accent-pill {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 100px; padding: 6px 14px; display: flex; gap: 12px; align-items: center;
    }
    .color-dot {
      width: 14px; height: 14px; border-radius: 50%; cursor: pointer;
      transition: transform 0.2s; border: 2px solid transparent;
    }
    .color-dot:hover { transform: scale(1.2); }
    .color-dot.active { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 10px var(--accent); }
    .mode-toggle {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--border);
      display: grid; place-items: center; cursor: pointer; color: var(--text);
      transition: 0.2s;
    }
    .mode-toggle:hover { background: var(--surface-h); transform: translateY(-2px); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; }

    /* ── TOPBAR ── */
    .topbar {
      height: var(--topbar-h); flex-shrink: 0;
      background: rgba(var(--surface-rgb), 0.9);
      -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; z-index: 100;
    }
    .topbar-left  { display: flex; align-items: center; gap: 20px; }
    .topbar-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .topbar-brand {
      width: 42px; height: 42px; border-radius: 12px; background: var(--accent);
      display: grid; place-items: center; color: #000; flex-shrink: 0;
      box-shadow: 0 4px 12px var(--accent);
    }
    .topbar-title { font-family: 'Outfit', sans-serif; font-size: 1.15rem; font-weight: 900; color: var(--text); text-transform: uppercase; letter-spacing: -0.02em; }
    .topbar-title span { font-weight: 400; color: var(--text-faint); }
    .btn-back {
      display: flex; align-items: center; gap: 8px; text-decoration: none;
      color: var(--accent); font-size: 0.75rem; font-weight: 800;
      padding: 10px 18px; border-radius: 12px; transition: all 0.2s;
      border: 1px solid var(--border); background: var(--surface-h);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .btn-back:hover { border-color: var(--accent); background: var(--surface); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(204,0,0,0.15); }

    /* ── LAYOUT ── */
    .app-container {
      display: grid; grid-template-columns: 300px 1fr;
      flex: 1; overflow: hidden; padding: 24px; gap: 24px; background: var(--bg);
    }

    /* ── SIDEBAR (filtros) ── */
    .sidebar {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px;
      display: flex; flex-direction: column; gap: 24px;
      box-shadow: var(--shadow-sm);
    }
    .section-title {
      font-size: 0.7rem; font-weight: 800; display: flex; align-items: center;
      gap: 8px; margin-bottom: 6px; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .filter-group { display: flex; flex-direction: column; gap: 6px; }
    .filter-group label { font-size: 0.62rem; font-weight: 800; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em; }

    select, input[type="text"], input[type="number"] {
      background: var(--surface-h); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text);
      padding: 11px 14px; font-family: var(--font); font-size: 0.85rem;
      outline: none; transition: all 0.2s; width: 100%; appearance: none;
    }
    select:focus, input:focus {
      background: var(--surface); border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(204,0,0,0.12);
    }
    select option { background: var(--bg-card); color: var(--text); }

    .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn {
      width: 100%; padding: 13px; border-radius: 12px; border: none;
      font-weight: 800; font-size: 0.78rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 8px; transition: all 0.2s; font-family: var(--font);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .btn-import { background: var(--accent); color: #000; }
    .btn-import:hover { opacity: 0.85; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    .btn-report { background: var(--surface-h); color: var(--accent); border: 1px solid var(--border); }
    .btn-report:hover { border-color: var(--accent); background: var(--surface); transform: translateY(-2px); }

    /* ── KPIs ── */
    .content { display: flex; flex-direction: column; gap: 20px; overflow: hidden; }
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .kpi-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px;
      box-shadow: 0 10px 30px -15px rgba(0,0,0,0.03); position: relative; overflow: hidden;
    }
    .kpi-card:hover { border-color: var(--accent); }
    .kpi-card::after { content: ''; position: absolute; left: 0; top: 0; width: 3px; height: 100%; background: var(--accent); }
    .kpi-label { font-size: 0.7rem; font-weight: 800; color: var(--text-faint); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.1em; }
    .kpi-value { font-family: var(--font); font-size: 2rem; font-weight: 900; font-style: italic; color: var(--text); letter-spacing: -0.02em; }

    /* ── TABLE ── */
    .table-container {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); flex: 1; overflow: hidden;
      display: flex; flex-direction: column; box-shadow: 0 10px 30px -15px rgba(0,0,0,0.03);
      isolation: isolate; contain: paint;
    }
    .table-scroll { flex: 1; overflow: auto; }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; font-size: 0.68rem; font-weight: 800; color: var(--text-faint);
      text-transform: uppercase; letter-spacing: 0.1em;
      padding: 16px 24px; background: var(--surface-h);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
    tbody tr:hover { background: var(--surface-h); }
    tbody td { padding: 14px 24px; font-size: 0.875rem; color: var(--text-dim); }
    .td-num { font-weight: 700; font-family: monospace; color: var(--text); }

    #file-input { display: none; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── EXTRACTED FROM INLINE STYLES ── */
    .accent-red    { background: #CC0000; }
    .accent-yellow { background: #FFD700; }
    .accent-pink   { background: #FF007A; }
    .accent-blue   { background: #0066FF; }
    .icon-sm { width: 14px; }
    .icon-xs { width: 13px; }
    #clock { font-family: var(--font); font-weight: 700; font-size: 14px; }
    .sidebar-hint { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 12px; }
    .filter-group-top { margin-top: 14px; }
    .filter-row-top { margin-top: 12px; }
    .section-bottom { margin-top: auto; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <h1 class="topbar-title">DOC <span>KM</span></h1>
    <a href="javascript:void(0)" onclick="if(window.history.length > 1) { history.back(); } setTimeout(() => { window.close(); window.location.href = '../portal.html'; }, 200);" class="btn-back">
      <i data-lucide="layout-grid" class="icon-sm"></i> VOLTA PARA PORTAL
    </a>
  </div>
  <div class="topbar-right">
    <div class="theme-picker">
      <div class="accent-pill">
        <div class="color-dot active accent-red" data-accent="#CC0000" onclick="setAccent('#CC0000',this)"></div>
        <div class="color-dot accent-yellow" data-accent="#FFD700" onclick="setAccent('#FFD700',this)"></div>
        <div class="color-dot accent-pink" data-accent="#FF007A" onclick="setAccent('#FF007A',this)"></div>
        <div class="color-dot accent-blue" data-accent="#0066FF" onclick="setAccent('#0066FF',this)"></div>
      </div>
      <div class="mode-toggle" id="btnTheme">
        <i data-lucide="moon" id="themeIcon"></i>
      </div>
    </div>
    <div id="clock">--:--</div>
  </div>
</div>

<div class="app-container">
  <aside class="sidebar">
    <div class="section">
      <div class="section-title"><i data-lucide="upload" class="icon-xs"></i> Importar Dados</div>
      <p class="sidebar-hint">Selecione o arquivo Excel exportado do sistema Contele.</p>
      <button type="button" class="btn btn-import" onclick="document.getElementById('file-input').click()">
        <i data-lucide="file-up"></i> Selecionar Arquivo
      </button>
      <input type="file" id="file-input" accept=".xlsx, .xls" aria-label="Selecionar arquivo Excel para importação">
    </div>

    <div class="section">
      <div class="section-title"><i data-lucide="filter" class="icon-xs"></i> Filtros</div>
      <div class="filter-group filter-group-top">
        <label>Funcionário</label>
        <select id="filter-func" title="Selecionar Funcionário"><option value="all">(Todos)</option></select>
      </div>
      
      <div class="filter-row filter-row-top">
        <div class="filter-group">
          <label>Tipo</label>
          <select id="filter-type" title="Filtrar por Tipo">
            <option value="all">(Todos)</option>
            <option value="KM">KM</option>
            <option value="OS">OS</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Coef.</label>
          <select id="filter-coef" title="Filtrar por Coeficiente">
            <option value="all">(Todos)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section section-bottom">
      <button type="button" class="btn btn-report" onclick="exportReport()">
        <i data-lucide="download"></i> Gerar Relatório
      </button>
    </div>
  </aside>

  <main class="content">
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Distância Total</div>
        <div class="kpi-value" id="kpi-km">0.00 km</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Reembolso Total</div>
        <div class="kpi-value" id="kpi-total">R$ 0,00</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total OS</div>
        <div class="kpi-value" id="kpi-os">0</div>
      </div>
    </div>

    <div class="table-container">
      <div class="table-scroll">
        <table id="main-table">
          <thead>
            <tr>
              <th>Data</th>
              <th>Técnico</th>
              <th>OS / Cliente</th>
              <th>Distância</th>
              <th>Valor</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  // ── MOTOR ORIGINAL (sem alterações) ──
  let rawData = [];
  const VALOR_KM = 1.10;

  document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, {type: 'array'});
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(firstSheet);
      processData(json);
    };
    reader.readAsArrayBuffer(file);
  });

  function processData(json) {
    rawData = json;
    render();
    updateFilters();
  }

  function updateFilters() {
    const funcs = [...new Set(rawData.map(r => r['Funcionário'] || r['Técnico'] || r['Nome']))].filter(Boolean).sort();
    const types = [...new Set(rawData.map(r => r['Tipo'] || r['Categoria']))].filter(Boolean).sort();
    const coefs = [...new Set(rawData.map(r => r['Coeficiente'] || r['Coef.']))].filter(Boolean).sort();

    document.getElementById('filter-func').innerHTML = '<option value="all">(Todos)</option>' + funcs.map(t => `<option value="${t}">${t}</option>`).join('');
    document.getElementById('filter-type').innerHTML = '<option value="all">(Todos)</option>' + types.map(t => `<option value="${t}">${t}</option>`).join('');
    document.getElementById('filter-coef').innerHTML = '<option value="all">(Todos)</option>' + coefs.map(t => `<option value="${t}">${t}</option>`).join('');
  }

  function render() {
    const fFunc = document.getElementById('filter-func').value;
    const fType = document.getElementById('filter-type').value;
    const fCoef = document.getElementById('filter-coef').value;

    const filtered = rawData.filter(r => {
      const matchFunc = fFunc === 'all' || (r['Funcionário'] || r['Técnico'] || r['Nome']) === fFunc;
      const matchType = fType === 'all' || (r['Tipo'] || r['Categoria']) === fType;
      const matchCoef = fCoef === 'all' || (r['Coeficiente'] || r['Coef.']) === fCoef;
      return matchFunc && matchType && matchCoef;
    });

    let totalKm = 0, totalVal = 0, totalOs = 0;
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = filtered.map(r => {
      const km = parseFloat(r['KM'] || r['Distância'] || 0);
      const val = km * VALOR_KM;
      totalKm += km; totalVal += val; totalOs++;
      return `<tr>
        <td>${r['Data'] || '--'}</td>
        <td>${r['Funcionário'] || r['Técnico'] || r['Nome'] || '--'}</td>
        <td>${r['OS'] || r['Cliente'] || '--'}</td>
        <td class="td-num">${km.toFixed(2)} km</td>
        <td class="td-num">R$ ${val.toFixed(2)}</td>
      </tr>`;
    }).join('');

    document.getElementById('kpi-km').textContent = totalKm.toFixed(2) + ' km';
    document.getElementById('kpi-total').textContent = 'R$ ' + totalVal.toLocaleString('pt-BR', {minimumFractionDigits:2});
    document.getElementById('kpi-os').textContent = totalOs;
    lucide.createIcons();
  }

  ['filter-func', 'filter-type', 'filter-coef'].forEach(id => {
    document.getElementById(id).addEventListener('change', render);
  });

  function exportReport() {
    if (!rawData.length) return alert('Nenhum dado carregado');
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(rawData);
    XLSX.utils.book_append_sheet(wb, ws, "Reembolso");
    XLSX.writeFile(wb, "Relatorio_KM.xlsx");
  }

  // ── SISTEMA DE TEMAS (idêntico ao portal) ──
  function setAccent(color, el) {
    document.documentElement.style.setProperty('--accent', color);
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
    el.classList.add('active');
    localStorage.setItem('nexus-accent', color);
  }

  function updateThemeIcon() {
    const isDark = document.documentElement.dataset.theme === 'dark';
    const icon = document.getElementById('themeIcon');
    if (icon) {
      icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      if (window.lucide) lucide.createIcons();
    }
  }

  function setupTheme() {
    const savedAccent = localStorage.getItem('nexus-accent') || '#CC0000';
    document.documentElement.style.setProperty('--accent', savedAccent);
    document.querySelectorAll('.color-dot').forEach(d => {
      const da = d.dataset.accent || '';
      d.classList.toggle('active', da.toUpperCase() === savedAccent.toUpperCase());
    });

    const savedTheme = localStorage.getItem('nexus-theme') || 'light';
    document.documentElement.dataset.theme = savedTheme;
    updateThemeIcon();

    document.getElementById('btnTheme').addEventListener('click', () => {
      const isDark = document.documentElement.dataset.theme === 'dark';
      document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
      localStorage.setItem('nexus-theme', document.documentElement.dataset.theme);
      updateThemeIcon();
    });
  }

  // ── BOOT ──
  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }, 1000);

  setupTheme();
  lucide.createIcons();
  
  window.addEventListener('storage', (e) => {
    if (e.key === 'nexus-theme' || e.key === 'nexus-accent') {
      setupTheme();
    }
  });
</script>
</body>
</html>
